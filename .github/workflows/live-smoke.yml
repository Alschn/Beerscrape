name: Live smoke tests

# Crawls a few pages of every real site to notice markup changes (or dead sites) early.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Live smoke tests
        run: uv run pytest -m live
